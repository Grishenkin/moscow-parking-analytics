
<svg xmlns="http://www.w3.org/2000/svg"
     width="1500"
     height="900"
     viewBox="0 0 1500 900">

<style>
    .title {
        font: bold 34px Arial, sans-serif;
        fill: #111;
    }

    .subtitle {
        font: 18px Arial, sans-serif;
        fill: #444;
    }

    .box-title {
        font: bold 20px Arial, sans-serif;
        fill: #111;
    }

    .box-text {
        font: 16px Arial, sans-serif;
        fill: #333;
    }

    .small {
        font: 14px Arial, sans-serif;
        fill: #444;
    }

    .box {
        fill: white;
        stroke: #333;
        stroke-width: 2;
        rx: 14;
    }

    .spark {
        fill: #fff3e8;
        stroke: #e25a1c;
        stroke-width: 3;
        rx: 14;
    }

    .airflow {
        fill: #eef7ff;
        stroke: #2878b5;
        stroke-width: 3;
        rx: 14;
    }

    .data {
        fill: #f5f5f5;
        stroke: #555;
        stroke-width: 2;
        rx: 14;
    }

    .dashboard {
        fill: #eefbef;
        stroke: #388e3c;
        stroke-width: 3;
        rx: 14;
    }

    .arrow {
        stroke: #333;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
    }
</style>

<defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth">

